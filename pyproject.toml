[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diting"
version = "0.1.0.dev0"
description = "谛听：一听便知，同一个概念散落在代码的何处。A concept index for code that refuses shared abstractions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# tree-sitter grammars, one extra per language; `all` installs every grammar
go = ["tree-sitter>=0.25", "tree-sitter-go>=0.23"]
java = ["tree-sitter>=0.25", "tree-sitter-java>=0.23"]
kotlin = ["tree-sitter>=0.25", "tree-sitter-kotlin>=1.0"]
javascript = ["tree-sitter>=0.25", "tree-sitter-javascript>=0.23"]
typescript = ["tree-sitter>=0.25", "tree-sitter-typescript>=0.23"]
rust = ["tree-sitter>=0.25", "tree-sitter-rust>=0.23"]
csharp = ["tree-sitter>=0.25", "tree-sitter-c-sharp>=0.23"]
c = ["tree-sitter>=0.25", "tree-sitter-c>=0.23"]
cpp = ["tree-sitter>=0.25", "tree-sitter-cpp>=0.23"]
ruby = ["tree-sitter>=0.25", "tree-sitter-ruby>=0.23"]
php = ["tree-sitter>=0.25", "tree-sitter-php>=0.23"]
all = ["tree-sitter>=0.25", "tree-sitter-go>=0.23", "tree-sitter-java>=0.23", "tree-sitter-kotlin>=1.0", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-rust>=0.23", "tree-sitter-c-sharp>=0.23", "tree-sitter-c>=0.23", "tree-sitter-cpp>=0.23", "tree-sitter-ruby>=0.23", "tree-sitter-php>=0.23"]

[project.scripts]
diting = "diting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
