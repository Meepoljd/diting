# diting concept-index gate. Generated by `diting ci-template`.
# Blocks a PR that changes one implementation of a business rule but not its siblings.
name: diting
on:
  pull_request:
  push:
    branches: [main]
jobs:
  diting-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for the merge-base used by --base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "diting @ git+https://github.com/Meepoljd/diting@main"
      - name: diting check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diting check --base "origin/${{ github.base_ref }}"
          else
            diting check
          fi
