name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,all]"
      - run: pytest -q
      - run: diting --help
      - name: e2e regression (real CLI, full agent workflow)
        env:
          DITING_E2E_REQUIRE_POLYGLOT: "1"
        run: bash scripts/e2e.sh
      - name: dogfood - generated CI template matches docs/diting-check.yml
        run: diting ci-template | diff - docs/diting-check.yml
